# prefix を Ctrl-a に変更
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# iTermっぽい分割
# prefix + d       -> 右に分割
# prefix + Shift+d -> 下に分割
bind-key d split-window -h -c "#{pane_current_path}"
bind-key D split-window -v -c "#{pane_current_path}"

# paneを閉じる
bind-key w kill-pane

# pane移動
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# pane resize（-r で prefix 押し直さず連打可能）
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# mouse有効化
set-option -g mouse on

# vi風キーバインド
set-window-option -g mode-keys vi

# Shift+Enter などの修飾付きキーをアプリに通す
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Shift+Enter を Alt+Enter (ESC + CR) に変換してアプリに渡す
# Claude Code などで改行入力として解釈される
bind-key -N "send escape+CR for shift-enter" -T root S-Enter send-keys Escape Enter

# 設定再読み込み
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
